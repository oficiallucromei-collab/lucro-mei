services:
  api:
    build: .
    environment:
      LUCROMEI_DATABASE_URL: postgresql+psycopg://lucromei:lucromei@db:5432/lucromei
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lucromei
      POSTGRES_USER: lucromei
      POSTGRES_PASSWORD: lucromei
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucromei"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

