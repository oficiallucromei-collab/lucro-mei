serviceAccount: projects/lucro-mei/serviceAccounts/lucromei-build@lucro-mei.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
timeout: 1800s

# _DEPLOY=true (the trigger default) migrates the database and moves the service to the
# image just built. Pass _DEPLOY=false to only publish the image.
substitutions:
  _DEPLOY: "true"
  _REGION: southamerica-east1
  _SERVICE: lucromei-test
  _MIGRATE_JOB: lucromei-migrate
  _OPS_JOB: lucromei-ops

steps:
  - id: validate-release
    name: python:3.12-slim
    entrypoint: bash
    env:
      - RELEASE_COMMIT=$COMMIT_SHA
      - RELEASE_PROJECT=$PROJECT_ID
    args:
      - -euc
      - |
        [[ "$$RELEASE_PROJECT" == "lucro-mei" ]]
        [[ "$$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
        python -m pip install '.[dev]'
        python -m ruff check src tests
        python -m pytest

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --platform=linux/amd64
      - --label=org.opencontainers.image.revision=$COMMIT_SHA
      - --tag=southamerica-east1-docker.pkg.dev/$PROJECT_ID/lucromei/lucromei:$COMMIT_SHA
      - .

  - id: smoke-test-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - scripts/smoke-image.sh
      - southamerica-east1-docker.pkg.dev/$PROJECT_ID/lucromei/lucromei:$COMMIT_SHA

  - id: push-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - |
        image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/lucromei/lucromei:$COMMIT_SHA
        docker push "$$image"
        docker inspect --format='{{index .RepoDigests 0}}' "$$image" > /workspace/image-digest
        grep -Eq '^southamerica-east1-docker[.]pkg[.]dev/lucro-mei/lucromei/lucromei@sha256:[a-f0-9]{64}$$' /workspace/image-digest
        cat /workspace/image-digest

  # Migrations must stay additive: the revision still serving keeps running while they apply.
  - id: migrate-database
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        [[ "$_DEPLOY" == "true" ]] || { echo "Skipping: _DEPLOY=$_DEPLOY"; exit 0; }
        image="$$(cat /workspace/image-digest)"
        gcloud run jobs update $_MIGRATE_JOB --region=$_REGION --image="$$image" --quiet
        gcloud run jobs execute $_MIGRATE_JOB --region=$_REGION --wait

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        [[ "$_DEPLOY" == "true" ]] || { echo "Skipping: _DEPLOY=$_DEPLOY"; exit 0; }
        image="$$(cat /workspace/image-digest)"
        gcloud run services update $_SERVICE --region=$_REGION --image="$$image" --quiet
        # Operator tools follow the release; skipped where the job does not exist.
        if gcloud run jobs describe $_OPS_JOB --region=$_REGION >/dev/null 2>&1; then
          gcloud run jobs update $_OPS_JOB --region=$_REGION --image="$$image" --quiet
        fi
        url="$$(gcloud run services describe $_SERVICE --region=$_REGION --format='value(status.url)')"
        for attempt in 1 2 3 4 5; do
          curl -fsS "$$url/health" && exit 0
          sleep 5
        done
        echo "Health check failed for $$url" >&2
        exit 1

images:
  - southamerica-east1-docker.pkg.dev/$PROJECT_ID/lucromei/lucromei:$COMMIT_SHA
