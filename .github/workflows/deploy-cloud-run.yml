name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-lucromei-test
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: lucro-mei
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and deploy through Cloud Build
        shell: bash
        run: |
          set -euo pipefail

          # Archive the triggering commit without including generated OIDC credentials.
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT
          git archive "$GITHUB_SHA" | tar -x -C "$source_dir"

          gcloud builds submit "$source_dir" \
            --project=lucro-mei \
            --region=global \
            --config="$source_dir/cloudbuild.yaml" \
            --gcs-source-staging-dir=gs://lucro-mei-release-source-312975377897/source \
            --ignore-file=/dev/null \
            --substitutions="COMMIT_SHA=$GITHUB_SHA,_DEPLOY=true" \
            --suppress-logs \
            --quiet
