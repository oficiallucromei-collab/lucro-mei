name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lucromei_test
          POSTGRES_USER: lucromei
          POSTGRES_PASSWORD: lucromei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lucromei"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LUCROMEI_DATABASE_URL: postgresql+psycopg://lucromei:lucromei@localhost:5432/lucromei_test
      LUCROMEI_TEST_DATABASE_URL: postgresql+psycopg://lucromei:lucromei@localhost:5432/lucromei_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Apply, check, and roll back migrations on PostgreSQL
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests on PostgreSQL
        run: pytest --cov=lucromei --cov-report=term-missing
